# Oppsett for Pages CMS (app.pagescms.org): bestemmer hvilke skjemaer Gaute ser
# når han redigerer nettsiden. Hver lagring blir en endring i GitHub, og Vercel
# bygger siden på nytt etter et par minutter.

settings:
  content:
    merge: true

media:
  input: public/bilder
  output: /bilder
  categories: [image]
  rename: safe

content:
  - name: forside
    label: Forsiden
    description: Sett sammen forsiden av byggeklosser. Se alle klossene på /klosser.
    type: file
    path: content/forside.md
    format: yaml-frontmatter
    fields:
      - name: tittel
        label: Navn (vises ikke)
        type: string
        hidden: true
      - name: seksjoner
        label: Seksjoner
        component: seksjoner

  - name: sider
    label: Sider
    description: Egne sider bygd av byggeklosser, på adressen valgogpolitikk.no/<filnavn>.
    type: collection
    path: content/sider
    exclude: [.gitkeep]
    format: yaml-frontmatter
    filename:
      template: "{tittel}.md"
      field: create
    view:
      primary: tittel
      fields: [tittel, utkast]
    fields:
      - name: tittel
        label: Tittel
        description: Vises i nettleserfanen og i søkeresultater.
        type: string
        required: true
      - name: beskrivelse
        label: Beskrivelse for søkemotorer
        type: text
      - name: utkast
        label: Utkast
        description: Huk av så lenge siden ikke er klar.
        type: boolean
        default: true
      - name: seksjoner
        label: Seksjoner
        component: seksjoner

  - name: innstillinger
    label: Innstillinger
    description: Menyen, bunnteksten og «Om»-boksen.
    type: file
    path: content/innstillinger.yml
    format: yaml
    fields:
      - name: meny
        label: Meny
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tekst}"
        fields:
          - name: tekst
            label: Tekst
            type: string
          - name: lenke
            label: Lenke
            description: For sider på nettsiden, f.eks. /kilder. For andre nettsteder, hele adressen.
            type: string
      - name: bunntekst
        label: Bunntekst
        type: object
        fields:
          - name: beskrivelse
            label: Beskrivelse
            type: text
          - name: grupper
            label: Lenkegrupper
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{overskrift}"
            fields:
              - name: overskrift
                label: Overskrift
                type: string
              - name: lenker
                label: Lenker
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{tekst}"
                fields:
                  - name: tekst
                    label: Tekst
                    type: string
                  - name: lenke
                    label: Lenke
                    description: Valgfri. Uten lenke vises bare teksten.
                    type: string
          - name: merknad
            label: Merknad nederst
            type: text
      - name: om
        label: «Om»-boksen ved innleggslista
        type: object
        fields:
          - name: tittel
            label: Tittel
            type: string
          - name: tekst
            label: Tekst
            type: text

  - name: trappa
    label: Trappa til toppen
    description: >-
      Teksten på siden /trappa. Tallene kommer fra datafila og oppdateres ikke her. Ord i krøllparentes byttes ut
      med tall: {aar}, {forskningsaar}, {topp01_snitt_offisiell}, {topp01_snitt_med}, {topp001_aar},
      {topp001_per_aar}, {budsjett_mrd}, {budsjett_aar}, {fra_utlandet_prosent}, {skattbar_formue_prosent},
      {topp100_skatt}, {topp100_inntektsskatt}, {kapital_aar}, {formue_aar}. Tom linje gir nytt avsnitt.
    type: file
    path: content/trappa.yml
    format: yaml
    fields:
      - name: topp
        label: Toppen av siden og kalkulatoren
        type: object
        fields:
          - { name: overlinje, label: Liten tekst over tittelen, type: string }
          - { name: tittel, label: Tittel, type: string }
          - { name: ingress, label: Ingress, type: text }
          - { name: sporsmal, label: Spørsmål over feltet, type: string }
          - { name: hjelpetekst, label: Hjelpetekst under spørsmålet, type: string }
      - name: inntektstrappa
        label: Inntektstrappa
        type: object
        fields:
          - { name: tittel, label: Tittel, type: string }
          - { name: ingress, label: Ingress, type: text }
          - { name: fotnote, label: Fotnote under søylene, type: text }
      - name: toppen
        label: «Jo rikere, jo mindre havner i skattemeldingen»
        type: object
        fields:
          - { name: tittel, label: Tittel, type: string }
          - { name: ingress, label: Ingress, type: text }
          - { name: fotnote, label: Fotnote, type: text }
      - name: formue
        label: Formue og Kapital 400
        type: object
        fields:
          - { name: tittel, label: Tittel, type: string }
          - { name: ingress, label: Ingress, type: text }
          - { name: etikett_samlet, label: Tekst under samlet formue, type: string }
          - { name: etikett_snitt, label: Tekst under snitt per person, type: string }
          - { name: etikett_milliardaerer, label: Tekst under antall milliardærer, type: string }
          - { name: etikett_rikeste, label: Tekst under den rikeste, type: string }
          - { name: trapp_tittel, label: Tittel på formuestrappa, type: string }
          - { name: trapp_ingress, label: Ingress til formuestrappa, type: text }
          - { name: trapp_slutt, label: Tekst nederst i formuestrappa, type: string }
          - { name: trapp_fotnote, label: Fotnote til formuestrappa, type: text }
          - { name: tekst, label: Tekst etter formuestrappa, type: text }
          - { name: fotnote, label: Fotnote, type: text }
      - name: hvorfor
        label: «Hvorfor to tall?»
        type: object
        fields:
          - { name: tittel, label: Tittel, type: string }
          - { name: tekst, label: Tekst, type: text }
      - name: metode
        label: «Slik er tallene regnet»
        type: object
        fields:
          - { name: tittel, label: Tittel, type: string }
          - { name: punkter, label: Punkter, type: text, list: true }

  - name: karuseller
    label: Karusellsider
    description: Én kildeside per karusell, på adressen valgogpolitikk.no/<filnavn>.
    type: collection
    path: content/karuseller
    format: yaml-frontmatter
    filename:
      template: "{tittel}.md"
      field: create
    view:
      primary: tittel
      fields: [tittel, utkast]
    fields:
      - name: tittel
        label: Tittel
        type: string
        required: true
      - name: ingress
        label: Ingress
        description: Én eller to setninger under tittelen.
        type: text
      - name: utkast
        label: Utkast
        description: Huk av så lenge siden ikke er klar. Utkast vises med et gult merke og skjules for søkemotorer.
        type: boolean
        default: true
      - name: instagram
        label: Lenke til karusellen på Instagram
        type: string
      - name: tema
        label: Tema for «Siste nytt»
        type: select
        options:
          values: [Skatt, Ulikhet og fordeling, Markedsmakt og konkurranse, Offentlige finanser, Arbeid og trygd, Bolig, Energi og strøm, EU og EØS, Velferd og privatisering]
      - name: slides
        label: Slides
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {tittel}"
        fields:
          - name: bilde
            label: Bilde av sliden
            type: image
          - name: tittel
            label: Overskrift
            type: string
          - name: tekst
            label: Teksten på sliden
            description: Skriv av hele teksten. Den leses opp for blinde og svaksynte.
            type: text
          - name: tall
            label: Tallet
            description: La stå tomt hvis sliden ikke har noe nytt tall.
            type: string
          - name: sikkerhet
            label: Hvor sikkert er tallet?
            type: select
            options:
              values: [sikkert, ganske sikkert, middels, usikkert]
          - name: kilder
            label: Kilder
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{navn}"
            fields:
              - name: navn
                label: Navn på kilden
                type: string
              - name: lenke
                label: Lenke
                type: string
              - name: merknad
                label: Merknad
                description: Hva tallet bygger på, eller hvordan det er regnet ut.
                type: text
      - name: body
        label: Slik regnet vi
        description: Vises nederst. La en tom linje skille avsnittene.
        type: text

  - name: skraablikk
    label: Skråblikk
    description: Karuseller med en spøk på hver slide og en forklaring som rulles ut. Adresse valgogpolitikk.no/skraablikk/<filnavn>.
    type: collection
    path: content/skraablikk
    format: yaml-frontmatter
    filename:
      template: "{tittel}.md"
      field: create
    view:
      primary: tittel
      fields: [tittel, dato, utkast]
      default:
        sort: dato
        order: desc
    fields:
      - name: tittel
        label: Tittel
        type: string
        required: true
      - name: ingress
        label: Ingress
        type: text
      - name: utkast
        label: Utkast
        description: Huk av så lenge forklaringene ikke er klare. Utkast vises ikke i oversikten.
        type: boolean
        default: true
      - name: dato
        label: Dato
        type: date
      - name: instagram
        label: Lenke til karusellen på Instagram
        type: string
      - name: slides
        label: Slides
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{{index}}. {{tekst}}"
        fields:
          - name: bilde
            label: Bilde av sliden
            type: image
          - name: tekst
            label: Teksten på sliden
            description: Skriv av teksten. Den leses opp for blinde og svaksynte.
            type: text
          - name: forklaring
            label: Forklaring
            description: Vises når man trykker «Se forklaringen». Første avsnitt vises litt større. La stå tomt for slides uten forklaring.
            type: rich-text
          - name: kilder
            label: Kilder
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{{navn}}"
            fields:
              - name: navn
                label: Navn
                type: string
              - name: lenke
                label: Lenke
                type: string

  - name: tema
    label: Temasider
    description: Temasider på adressen valgogpolitikk.no/tema/<filnavn>.
    type: collection
    path: content/tema
    format: yaml-frontmatter
    filename:
      template: "{tittel}.md"
      field: create
    view:
      primary: tittel
      fields: [tittel, utkast]
    fields:
      - name: tittel
        label: Tittel
        type: string
        required: true
      - name: ingress
        label: Ingress
        type: text
      - name: utkast
        label: Utkast
        description: Huk av så lenge siden ikke er klar.
        type: boolean
        default: true
      - name: temaer
        label: Temaer for «Siste nytt»
        type: select
        options:
          multiple: true
          values: [Skatt, Ulikhet og fordeling, Markedsmakt og konkurranse, Offentlige finanser, Arbeid og trygd, Bolig, Energi og strøm, EU og EØS, Velferd og privatisering]
      - name: nokkeltall
        label: Nøkkeltall
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tall}"
        fields:
          - name: tall
            label: Tallet
            type: string
          - name: tekst
            label: Forklaring
            type: text
          - name: kilde
            label: Kilde
            type: string
          - name: lenke
            label: Lenke til kilden
            type: string
      - name: kilder
        label: Kilder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{navn}"
        fields:
          - name: navn
            label: Navn
            type: string
          - name: utgiver
            label: Utgiver
            type: string
          - name: lenke
            label: Lenke
            type: string
          - name: kommentar
            label: Kommentar
            type: text
          - name: bruk
            label: Bruk den til
            type: text
      - name: analyser
        label: Analyser
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tittel}"
        fields:
          - name: tittel
            label: Tittel
            type: string
          - name: lenke
            label: Lenke
            description: For innlegg på nettsiden, f.eks. /innlegg/norge-har-ikke-verdens-hoyeste-skatter
            type: string
          - name: type
            label: Type
            description: Står under tittelen. Tomt gir «Analyse».
            type: string
      - name: karuseller
        label: Karuseller
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tittel}"
        fields:
          - name: tittel
            label: Tittel
            type: string
          - name: lenke
            label: Lenke
            type: string
      - name: body
        label: Innledning
        description: Vises over kildelista. La en tom linje skille avsnittene.
        type: text

  - name: innlegg
    label: Innlegg
    description: Analyser på valgogpolitikk.no/innlegg/<slug>.
    type: collection
    path: content/innlegg
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.mdx"
      field: create
    view:
      primary: title
      fields: [title, date, draft]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tittel
        type: string
        required: true
      - name: slug
        label: Adresse
        description: Små bokstaver og bindestrek, f.eks. norge-har-ikke-verdens-hoyeste-skatter
        type: string
        required: true
      - name: date
        label: Dato
        type: date
      - name: draft
        label: Skjult
        description: Huk av for å skjule innlegget fra nettsiden.
        type: boolean
      - name: category
        label: Kategori
        type: select
        options:
          values: [skatt, arbeid, ulikhet, velferd, sammenligning, faktasjekk]
      - name: tags
        label: Stikkord
        type: string
        list: true
      - name: summary
        label: Sammendrag
        type: text
      - name: accentColor
        label: Farge
        description: Fargekode, f.eks. #d6336c
        type: string
      - name: image
        label: Bilde
        type: image
      - name: sources
        label: Kilder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Navn
            type: string
          - name: url
            label: Lenke
            type: string
      - name: body
        label: Tekst
        description: Markdown. Diagrammer skrives som <Chart ... />, se eksisterende innlegg.
        type: code
        options:
          format: markdown

components:
  bakgrunn:
    label: Bakgrunn
    type: select
    default: hvit
    options:
      values: [hvit, lys]

  seksjoner:
    label: Seksjoner
    description: Seksjonene vises i denne rekkefølgen. Dra for å flytte dem.
    type: block
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {type} {tittel}{overskrift}"
    blocks:
      - name: toppfelt
        label: Toppfelt
        fields:
          - name: overlinje
            label: Overlinje
            description: Liten tekst over tittelen.
            type: string
          - name: tittel
            label: Tittel
            type: string
          - name: ingress
            label: Ingress
            type: text
          - name: bilde
            label: Bilde til høyre
            type: image
          - name: bokrygger
            label: Vis bokryggene til høyre (når det ikke er bilde)
            type: boolean
          - name: farge
            label: Bakgrunn
            description: «rosa» er samme farge som profilbildet på Instagram. Passer best øverst på forsiden.
            type: select
            default: mork
            options:
              values: [mork, rosa]

      - name: tekst
        label: Tekst
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: tekst
            label: Tekst
            type: rich-text
          - name: bakgrunn
            component: bakgrunn

      - name: nokkeltall
        label: Nøkkeltall
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: tall
            label: Tall
            description: Fire eller færre ser best ut.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{tall}"
            fields:
              - name: tall
                label: Tallet
                type: string
              - name: tekst
                label: Forklaring
                type: text
              - name: kilde
                label: Kilde
                type: string
              - name: lenke
                label: Lenke til kilden
                type: string
          - name: bakgrunn
            component: bakgrunn

      - name: bilde
        label: Bilde
        fields:
          - name: bilde
            label: Bilde
            type: image
          - name: alt
            label: Beskrivelse for skjermlesere
            description: Hva bildet viser. Er det en graf, skriv hovedpoenget.
            type: text
          - name: bildetekst
            label: Bildetekst
            type: text
          - name: bredde
            label: Bredde
            type: select
            default: normal
            options:
              values: [normal, bred]
          - name: bakgrunn
            component: bakgrunn

      - name: datawrapper
        label: Graf fra Datawrapper
        fields:
          - name: lenke
            label: Lenke til grafen
            description: Lim inn lenken fra Datawrapper (Publish → «Share link», f.eks. https://datawrapper.dwcdn.net/AbC12/1/). Grafen oppdateres her når du publiserer den på nytt i Datawrapper.
            type: string
          - name: beskrivelse
            label: Beskrivelse for skjermlesere
            description: Hva grafen viser, i én setning. Skriv hovedpoenget.
            type: text
          - name: bredde
            label: Bredde
            type: select
            default: normal
            options:
              values: [normal, bred]
          - name: bakgrunn
            component: bakgrunn

      - name: sitat
        label: Sitat
        fields:
          - name: sitat
            label: Sitat
            type: text
          - name: kilde
            label: Hvem sa det
            type: string
          - name: bakgrunn
            component: bakgrunn

      - name: kildeliste
        label: Kildeliste
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: kilder
            label: Kilder
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{navn}"
            fields:
              - name: navn
                label: Navn
                type: string
              - name: utgiver
                label: Utgiver
                type: string
              - name: lenke
                label: Lenke
                type: string
              - name: kommentar
                label: Kommentar
                type: text
              - name: bruk
                label: Bruk den til
                type: text
          - name: bakgrunn
            component: bakgrunn

      - name: knapp
        label: Knapp
        fields:
          - name: forklaring
            label: Setning foran knappen
            type: text
          - name: tekst
            label: Knappetekst
            type: string
          - name: lenke
            label: Lenke
            type: string
          - name: bakgrunn
            component: bakgrunn

      - name: karuseller
        label: Karuseller
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: antall
            label: Hvor mange
            description: Tomt gir 8.
            type: number
          - name: bakgrunn
            component: bakgrunn

      - name: skraablikk
        label: Skråblikk
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: antall
            label: Hvor mange
            description: Tomt gir 4.
            type: number
          - name: bakgrunn
            component: bakgrunn

      - name: temaoversikt
        label: Temaoversikt
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: bakgrunn
            component: bakgrunn

      - name: siste_nytt
        label: Siste nytt fra kildene
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: tema
            label: Tema
            description: Tomt gir alle temaer.
            type: select
            options:
              values: [Skatt, Ulikhet og fordeling, Markedsmakt og konkurranse, Offentlige finanser, Arbeid og trygd, Bolig, Energi og strøm, EU og EØS, Velferd og privatisering]
          - name: antall
            label: Hvor mange
            description: Tomt gir 6.
            type: number
          - name: bakgrunn
            component: bakgrunn

      - name: kildeband
        label: Kildebånd (Utvalgt og Løpende)
        fields: []

      - name: siste_analyser
        label: Siste analyser
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: antall
            label: Hvor mange
            description: Tomt gir 3.
            type: number
          - name: bakgrunn
            component: bakgrunn

      - name: analyser
        label: Alle analyser (arkiv med søk)
        fields: []

      - name: samarbeid
        label: Samarbeid og tips
        fields:
          - name: overskrift
            label: Overskrift
            type: string
            default: Samarbeid og tips
          - name: tekst
            label: Tekst
            type: text
          - name: epost
            label: E-postadresse
            type: string
            default: post@valgogpolitikk.no
          - name: knapp
            label: Tekst på knappen
            type: string
            default: Send en melding
          - name: bakgrunn
            component: bakgrunn

      - name: nyhetsbrev
        label: Nyhetsbrev
        fields:
          - name: overskrift
            label: Overskrift
            type: string
          - name: tekst
            label: Tekst
            type: text
          - name: bakgrunn
            component: bakgrunn
