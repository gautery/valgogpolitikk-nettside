- 'Avtale og verbaler: budsjettavtalen med 70 verbalforslag og merknader mellom Arbeiderpartiet, Senterpartiet, SV og Rødt'
- Begge dokumentene ligger på arbeiderpartiet.no/aktuelt/enighet-om-budsjett
